
name: Build Wallpaper World APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Wallpaper-World-Android-Project-FIXED.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          test -f Wallpaper-World-Android-Project-FIXED.zip
          unzip -o Wallpaper-World-Android-Project-FIXED.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle 8.9
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wallpaper-World-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
